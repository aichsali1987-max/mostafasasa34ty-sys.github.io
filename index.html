<script>
const ITEMS=[{"code": "A1", "d": "A", "max": 2, "name": "أخذ المعزز حينما ي ُعرض عليه.", "goal": "حينما يعرض شيء أو نشاط معزز للطفل، فإنه سيأخذه أو يستخدمه.", "q": "حينما تقدم للطفل معزز مفضل، فهل سيأخذه ؟", "ex": "يأخذ الطفل بونبوني ويأكله، حينما يعرض عليه.", "notes": "يقيس المدة وهيأخذه في وقت أد ايه ؟ ولكن لازم يأخذه وإلا لا يكون معزز.", "lv": {"2": "يأخذه فى كل مرة يعرض عليه خلال (3) ثواني من عرضه.", "1": "يأخذه أحياناً أو يأخذه في كل مرة، ولكن خلال أكثر من (3) ثواني من عرضه."}}, {"code": "A2", "d": "A", "max": 2, "name": "أخذ المعزز من ضمن اختيارين.", "goal": "حينما يقدم للطفل شيء أو نشاط معزز، ومعه شيء أو نشاط أخر غير معزز، فإنه سيختار الشيء أو النشاط المعزز.", "q": "حينما تقدم للطفل شيء معزز ومعه شيء آخر غير معزز، فهل سيأخذ الشيء المعزز ؟", "ex": "حينما يعرض علي الطفل بونبوني وحذاء فإنه سيأخذ البونبوني.", "notes": "", "lv": {"2": "يأخذه فى كل مرة يعرض عليه خلال (3) ثواني من عرضه.", "1": "يأخذه أحيانا ً أو يأخذه في كل مرة، ولكن خلال أكثر من (3) ثواني من عرضه."}}, {"code": "A3", "d": "A", "max": 4, "name": "النظر لشئ غير معزز.", "goal": "سينظر الطفل لشئ غير معزز حينما يعرضه عليه المعلم.", "q": "حينما تقدم للطفل شيء غير معزز، فهل سينظر إليه ؟", "ex": "عندما تمسك بالقلم، وتطلب من الطفل أن ينظر إليه، فإنه سينظر إليه، ثم يتابعه بعينيه عندما تقوم بتحريكه أمامه في اتجاهات مختلفة (فوق / تحت / يمين / يسار).", "notes": "يساعد علي المرونة في نقل وزيادة الانتباه البصري.", "lv": {"4": "يتابع حركة الشيء في (6) اتجاهات خلال (10) ثواني من عرضه.", "3": "يتابع حركة الشيء في (4) اتجاهات خلال (10) ثواني من عرضه.", "2": "ينظر إلى الشيء في أي اتجاه (فوق - تحت - شمال - يمين) خلال (3) ثواني من عرضه في الاتجاه الواحد.", "1": "ينظر إلى الشيء مع وجود مساعدة، خلال (3) ثواني أو أكثر من عرضه."}}, {"code": "A4", "d": "A", "max": 2, "name": "أخذ شيء مألوف حينما يقدم إليه.", "goal": "يأخذ الطفل شيئا ً مألوفاً حينما يقدم إليه.", "q": "حينما يقدم شيء مألوف للطفل، فهل سيأخذه ؟", "ex": "حينما تقدم للطفل قلم سيأخذه.", "notes": "", "lv": {"2": "يأخذه في كل مرة يعرض عليه خلال (3) ثواني من عرضه.", "1": "يأخذه أحيانا ً أو يأخذه في كل مرة، ولكن خلال أكثر من (3) ثواني من عرضه."}}, {"code": "A5", "d": "A", "max": 4, "name": "يقترب للحصول على المعزز بعد أداء مهمة بسيطة.", "goal": "يقترب الطفل من المعلم عند عرض معزز، ثم يقوم بأداء مهمة بسيطة حتى يحصل عليه (الطفل يعرف بأن هناك معزز سيحصل عليه، ولكن ذلك يتطلب منه الاقتراب وأداء مهمة بسيطة للحصول على المعزز).", "q": "عند عرض معزز مفضل للطفل، فهل سيقترب من المعلم، ويؤدي مهمة بسيطة لكي يحصل عليه ؟", "ex": "لدى المعلم بونبوني ، والطفل يريده، فيأتي عبر الحجرة، ويقلد التصفيق حتى يحصل عليه.", "notes": "", "lv": {"4": "يجلس إلى الطاولة لأداء عدة مهام مألوفة، وكل مهمة لها تعزيز مستقل (يقترب ثم يؤدي مهمة وي عزز، وت طلب منه أخرى وي عزز وهكذا..).", "3": "يقترب بسهولة، ويؤدي عدة مهام مألوفة (كل مهمة بتعزيز).", "2": "يقترب بسهولة، ويؤدي عدة مهام مألوفة بشكل منفصل (يقترب ويؤدي مهمة واحدة ثم ي عزيز ثم يذهب، وهكذا..).", "1": "يقترب أحيانا ً، ويؤدي على الأقل مهمة واحدة للحصول على المعزز."}}, {"code": "A6", "d": "A", "max": 4, "name": "الاستجابة للتعليمات للحصول على المعزز من المعلم.", "goal": "سيسعى الطفل للحصول على المعزز من المعلم، ولذلك سيقوم بتنفيذ التعليمات التي تطلب منه.", "q": "هل يقوم الطفل بأداء عدة مهام متتالية للحصول على المعزز من المعلم ؟", "ex": "حينما تعطي الطفل ثلاث قطع من البازل، (قطعة في كل مرة)، فإنه سيضع هذه القطع في مكانها للحصول على بونبوني.", "notes": "* التعزيز بعد أكثر من استجابة يقيس قوة المعزز في ظل تعدد التعليمات والمهام. * الاستجابة الجديدة (المهارة الجديدة تتم في ظل المساعدة). * أداء المهارة سابقا ً كان يتم في ظل المساعدة، وحاليا ً يتم دون مساعدة).", "lv": {"4": "يؤدي (5) مهام جديدة للحصول على معزز محدد.", "3": "يؤدي مهمتين جديدتين، و3 مهام مألوفة للحصول على معزز محدد.", "2": "يؤدي (5) مهام مألوفة للحصول على معزز محدد.", "1": "يؤدي (3) مهام مألوفة للحصول على معزز محدد."}}, {"code": "A7", "d": "A", "max": 2, "name": "الاستجابة للعديد من المعلمين.", "goal": "يستخدم الطفل مهارات التعميم مع أكثر من معلم.", "q": "هل يستخدم الطفل مهارات التعميم عند العمل مع معلمين آخرين ؟", "ex": "يتعلم الطفل تقليد التصفيق، ولمس أنفه مع معلم، ومن ثم يفعل نفس الاستجابات مع معلمين آخرين.", "notes": "", "lv": {"2": "يستجيب بسهولة مع (3) معلمين جدد أو أكثر بنفس معدل وجودة الاستجابة.", "1": "يستجيب بسهولة مع (3) معلمين مألوفين أو أكثر بنفس معدل وجودة الاستجابة."}}, {"code": "A8", "d": "A", "max": 2, "name": "انتظار التعليمات بدون لمس الأدوات المعروضة أمامه.", "goal": "ينتظر الطفل بهدوء، ويبقى يديه بعيدة عن الأدوات حتى يقدم المعلم له التعليمات المطلوبة.", "q": "هل ينتظر الطفل بهدوء، ويبقى يديه بعيدة عن الأدوات حتى يقدم المعلم له التعليمات المطلوبة ؟", "ex": "يبقى هادئ، ويديه على الطاولة أمامه بدون لمس الأدوات، وينتظر حتى ي طلب منه أداء مهمة ما.", "notes": "", "lv": {"2": "أثناء الجلوس أو الوقوف أمام الأدوات، ينتظر الطفل هادئ بدون لمس الأدوات.", "1": "يحتاج فقط تنبيه واحد للجلوس أو الوقوف هادئ، حتى يبقى يديه بعيدة عن الأدوات."}}, {"code": "A9", "d": "A", "max": 2, "name": "النظر إلى المعلم للحصول على تعليمات.", "goal": "ينظر الطفل إلى المعلم ليحصل على التعليمات.", "q": "هل ينظر الطفل إلى المعلم ليحدد له المهمة المطلوبة منه ؟", "ex": "", "notes": "", "lv": {"2": "ينظر الطفل في كل مرة إلى المعلم للحصول على التعليمات الجديدة.", "1": "يحتاج إلى مساعدة واحدة فقط لكي ينظر إلى المعلم."}}, {"code": "A10", "d": "A", "max": 2, "name": "فحص الأدوات قبل أداء المهمة.", "goal": "عندما تقدم تعليمات للقيام بمهمة تعليمية، فإن الطفل يفهم التعليمات، ويفحص الأدوات قبل أداء المهمة.", "q": "هل يفحص الطفل الأدوات قبل أداء المهمة المطلوبة منه ؟", "ex": "عند إعطاء أمر (أعطني قلم)، فإن الطفل سينظر إلى كل الأدوات المعروضة أمامه، حتى يجد القلم.", "notes": "", "lv": {"2": "ينظر في كل مرة إلى أكثر من (6) أدوات معروضه أمامه خلال (3) ثواني (قبل أداء المهمة).", "1": "ينظر في كل مرة إلى أكثر من (3) أدوات معروضه أمامه خلال (3) ثواني (قبل أداء المهمة)."}}, {"code": "A11", "d": "A", "max": 2, "name": "يستجيب بسرعة عند إعطاء التعليمات.", "goal": "يستجيب الطفل سريعا ً عندما يقدم المعلم له التعليمات.", "q": "هل يؤدي الطفل التعليمات فورا ً بعد تقديمها له ؟", "ex": "عندما يطلب من الطفل الإشارة لصورة الطائر، فإنه سيبدأ فورا ً بالبحث عنها وا ن الطفل يردد (تفاح ، موز ، خبز) أو (كعك ، بيتزا ، تفاح).", "notes": "مهمة علشان الطفل يديني إجابات مختلفة لنفس السؤال زي بتاكل بأيه ؟ فيرد : بالشوكة، وأيه ؟ والمعلقة، والسكينة.", "lv": {"2": "يستخدم بتلقائية مجموعة من الإجابات الملائمة بدلا ً من إجابة واحدة، مع التنوع في الإجابة بعدة عناصر.", "1": "يستخدم بعض الإجابات البديلة مع أقل مساعدة لفظية."}}, {"code": "P6", "d": "P", "max": 2, "name": "تعميم مهارات اللغة.", "goal": "سيتمكن الطفل من استخدام الكلمات المكتسبة نوع من أنواع مهارات اللغة مع أنواع أخرى.", "q": "هل يستطيع الطفل تعلم نوعاً واحداً من مهارات اللغة ثم يستخدم الكلمات المكتسبة مع أنواع أخرى من مهارات اللغة ؟", "ex": "عند تعلم تسمية كلمة \" كوب \" يستطيع الطفل حينئذ أن يطلب كوبا ً، ويختار/ يتعرف على الأكواب بأسلوب تلقائي. وحينما يتعلم اختيار الكوب ثم يقال له تشرب منه، فإن الطفل سيتمكن من ترديد كلمة \"كوب\" حينما ي سأل بماذا تشرب ؟ ما الذي تشرب منه ؟", "notes": "- مدي قدرة الطفل على استخدام: (الطلب ، والتسمية ، والتقليد ، واللغة الاستقبالية ، والحوار). - أن الطفل يستطيع أن (يطلب ويسمي ويقلد لفظيا ً ويتعرف ويعمل حوار حول نفس الشيء مثل؛ تفاحة أو حقيبة).", "lv": {"2": "حينما يتعلم الطفل تسمية شيء ما بأسلوب تلقائي عند عرض وظيفة الشيء عليه، فإنه يستطيع حينئذ ذكر الشيء حينما يتعرف شفاهه على وظيفته.", "1": "عند تعلم أسم شيء ما، فإن الطفل يطلب هذا الشيء ويسميه بأسلوب تلقائي."}}, {"code": "Q1", "d": "Q", "max": 4, "name": "التعرف على الحروف الهجائية.", "goal": "سيتمكن الطفل من التعرف على الحروف الهجائية.", "q": "هل يتعرف الطفل على الحروف الهجائية ؟", "ex": "عند عرض ثلاثة أحرف فإن الطفل يمكنه الإشارة لحرف \" ب \" عند الطلب.", "notes": "(ملاحظات عامة): * قراءة + معرفة بالحروف = يتهجى + يقرأ. * قراءة + عدم معرفة بالحروف = جشطالتي (لا يتهجى) * معرفة حروف بدون قراءة = يتهجى فقط.", "lv": {"4": "يمكنه التعرف على كل الحروف بأشكالها المختلفة في الكلمة.", "3": "يمكنه التعرف على (15) حرف.", "2": "يمكنه التعرف على (10) حروف على الأقل.", "1": "على الأقل (5) حروف."}}, {"code": "Q2", "d": "Q", "max": 4, "name": "النطق بإسم الحروف الهجائية.", "goal": "سيتمكن الطفل من تسمية الحروف ا ة وعدم تشابه الحروف."}}, {"code": "Q9", "d": "Q", "max": 2, "name": "ملأ الفراغات بالحروف الناقصة في الكلمة.", "goal": "عند عرض صورة لشيء ما مع كتابة حرفين فقط من ثلاثة حروف، فإن الطفل سيتمكن من إضافة الحرف الناقص لتكملة الكلمة.", "q": "هل يستطيع الطفل إضافة حرف لتكملة كلمة ذات ثلاثة حروف عند عرض صور الشيء، وحرفين من الثلاث حروف المكونة للكلمة ؟", "ex": "عند عرض صورة قطة والكلمة (قــ... ــة)، فإن الطفل سيضيف \" ط \" لتكملة الكلمة.", "notes": "", "lv": {"2": "يمكنه إضافة حرف في أي وضع في الكلمة فيما يتصل بـ (10) كلمات على الأقل.", "1": "يمكنه إضافة حرف في وضع واحد على الأقل من الكلمة، فيما يتصل بـ (5) كلمات على الأقل."}}, {"code": "Q10", "d": "Q", "max": 4, "name": "قراءة الكلمات البسيطة.", "goal": "سيتمكن الطفل من قراءة كلمات.", "q": "هل يستطيع الطفل قراءة كلمات ؟", "ex": "", "notes": "الكلمات هنا مكونة من 3 أو 4 حروف مثل؛ ضرب ولعب، وردة.", "lv": {"4": "يمكنه قراءة (50) كلمة على الأقل.", "3": "يمكنه قراءة (20) كلمة على الأقل.", "2": "يمكنه قراءة (10) كلمات على الأقل.", "1": "يمكنه قراءة (5) كلمات على الأقل."}}, {"code": "Q11", "d": "Q", "max": 2, "name": "قراءة كلمات جديدة.", "goal": "سيتمكن الطفل من قراءة كلمات جديدة غير معلومة له.", "q": "هل يستطيع الطفل قراءة كلمات جديدة غير معلومة له ؟", "ex": "", "notes": "", "lv": {"2": "يستطيع نطق (20) كلمة تتكون من (4) حروف أو أكثر.", "1": "يستطيع نطق أي كلمة من (3) حروف باستعمال أصوات حروف تعلمها."}}, {"code": "Q12", "d": "Q", "max": 4, "name": "قراءة جمل بسيطة من 3 كلمات.", "goal": "سيتمكن الطفل من قراءة جمل بسيطة.", "q": "هل يستطيع الطفل قراءة جمل بسيطة ؟", "ex": "", "notes": "الفكرة هنا أن الطفل كان يقرأ كلمات منفصلة، فهل يستطيع أن يقرأها في جملة ؟", "lv": {"4": "يستطيع قراءة أي جملة تتضمن تركيبات من كلمات معلومة.", "3": "يستطيع قراءة (10) جملة تتألف من 3 كلمات.", "2": "يستطيع قراءة (5) عبارات تتألف من 3 كلمات.", "1": "يستطيع قراءة عبارتين تتألفا من (3) كلمات."}}, {"code": "Q13", "d": "Q", "max": 4, "name": "قراءة جمل طويلة (3 - 6 كلمات).", "goal": "سيتمكن الطفل من قراءة جمل طويلة.", "q": "هل يستطيع الطفل قراءة جمل طويلة V:["تدريب على استخدام الملعقة والكوباية والشوكة مع تقليل المساعدة تدريجيا.","تدريب على آداب المائدة بقصة صورية.","إتاحة الاختيار بين أكلتين لتنمية الاستقلال."],
W:["جدول صور لخطوات غسل اليد والوش والسنان.","تدريب على المشط والمنديل بالمرآة.","تعزيز الاستقلال خطوة خطوة."],
X:["جدول زمني ثابت لدخول الحمام مع صور لخطوات التسلسل.","تعزيز فوري لكل نجاح وجلسة قصيرة مريحة.","قصة اجتماعية مصورة عن استخدام الحمام."],
Y:["مسار حركي (قفز، زحف، تسلق) ولعب بالكرة.","ألعاب توازن (مشي على خط، وقوف على رجل).","أنشطة ركض وقفز بإيقاع وموسيقى."],
Z:["عجين وصلصال وخرز وقص ولصق.","تلوين وتتبع ورسم أشكال بأدوات مختلفة.","فتح وغلق علب وأغطية ومفاتيح وأزرار."]};
const $=s=>document.querySelector(s);
const CF=[["name","اسم الطفل"],["dob","تاريخ الميلاد","date"],["ad","تاريخ التقييم","date"],["sex","النوع"],["diag","التشخيص (إن وجد)"],["inf","اسم ولي الأمر(الأم/الأب)"],["sch","اسم المؤسسة التعليمية"]];
const CF2=[["comp","نوع الاعاقة"],["fam","الأسرة والبيئة"],["med","التاريخ الطبي والنمائي"],["str","نقاط القوة"],["int","اهتمامات الطفل والمعززات"],["beh","سلوكيات تحتاج متابعة"],["prev","التدخلات السابقة"],["note","ملاحظات أخرى"]];
let S={},C={},P={};
try{S=JSON.parse(localStorage.getItem("ablls_s")||"{}");P=JSON.parse(localStorage.getItem("ablls_p")||"{}");C=JSON.parse(localStorage.getItem("ablls_c")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("ablls_s",JSON.stringify(S));localStorage.setItem("ablls_p",JSON.stringify(P));localStorage.setItem("ablls_c",JSON.stringify(C))}catch(e){}};
function age(){if(!C.dob||!C.ad)return"";let a=new Date(C.dob),b=new Date(C.ad);if(b<a)return"";let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return y+" سنة و"+m+" شهر و"+d+" يوم"}
function form(el,arr,ta){$(el).innerHTML=arr.map(([k,l,t])=>`<div><label>${l}</label>${ta?`<textarea data-k="${k}">${C[k]||""}</textarea>`:`<input data-k="${k}" type="${t||"text"}" value="${C[k]||""}">`}</div>`).join("")+(ta?"":`<div><label>العمر عند التقييم</label><input id="ag" readonly value="${age()}"></div>`)}
form("#cf",CF);form("#cf2",CF2,1);
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){C[k]=e.target.value;save();const a=$("#ag");if(a)a.value=age()}});
const doms=Object.keys(DOM);let cur="A";
$("#chips").innerHTML=doms.map(d=>`<button class="chip" data-d="${d}">${d} ${DOM[d]}</button>`).join("");
$("#chips").onclick=e=>{const d=e.target.dataset.d;if(d){cur=d;drawA()}};
function go(t){["case","assess","res"].forEach(s=>$("#"+s).classList.toggle("hide",s!==t));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(t==="assess")drawA();if(t==="res")drawR();scrollTo(0,0)}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
const lvTxt=(i,n)=>i.lv[n]||"راجع نص المحك في ملف الـ PDF الأصلي.";
const PL={i:"مستقل (لا يحتاج تدريب)",v:"بمساعدة لفظية",g:"بمساعدة إشارية",p:"بمساعدة جسدية"};
const mxOf=i=>Math.max(i.max||0,...Object.keys(i.lv).map(Number));
const need=i=>(S[i.code]!=null&&S[i.code]<mxOf(i))||(P[i.code]&&P[i.code]!=="i");
const isInd=i=>(S[i.code]!=null&&S[i.code]>=mxOf(i)&&(!P[i.code]||P[i.code]==="i"))||(S[i.code]==null&&P[i.code]==="i");
function drawA(){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.d===cur));
const l=ITEMS.filter(i=>i.d===cur),done=l.filter(i=>S[i.code]!=null).length;
$("#dh").innerHTML=`<h2>${cur} — ${DOM[cur]}</h2><div class="mu">تم تقييم ${done} من ${l.length} بند</div><div class="bar"><i style="width:${done/l.length*100}%;background:var(--pr)"></i></div>`;
$("#items").innerHTML=l.map(i=>{const mx=Math.max(i.max||0,...Object.keys(i.lv).map(Number));return`<div class="it"><div><span class="cd">${i.code}</span><b>${i.name}</b></div>
<div class="mu">${i.goal}</div><div style="font-size:14px;margin-top:4px">❓ ${i.q}</div>${i.ex?`<div class="mu">مثال: ${i.ex}</div>`:""}${i.notes?`<div class="mu">ملاحظة: ${i.notes}</div>`:""}
<div class="sc">${Array.from({length:mx+1},(_,n)=>`<button data-c="${i.code}" data-n="${n}" class="${n<mx?"t":"m"} ${S[i.code]===n?"on":""}">${n}</button>`).join("")}</div><div class="sc" style="margin-top:0">${Object.keys(PL).map(k=>`<button style="min-width:auto;padding:0 12px;font-size:13px" data-c="${i.code}" data-p="${k}" class="${P[i.code]===k?"on":""}">${PL[k]}</button>`).join("")}</div><div class="mu">🔴 تحتاج تدريب: ${mx>1?"من 0 إلى "+(mx-1):"0"} — 🟢 متقن: ${mx}</div>
<details><summary>محكات الدرجات</summary>${Array.from({length:mx},(_,k)=>mx-k).map(n=>`<div class="lv"><b>${n} =</b> ${lvTxt(i,n)}</div>`).join("")}<div class="lv"><b>0 =</b> لا يحقق المحك.</div></details></div>`}).join("")}
$("#items").onclick=e=>{const b=e.target.closest("button[data-c]");if(!b)return;const c=b.dataset.c;if(b.dataset.p){if(P[c]===b.dataset.p)delete P[c];else P[c]=b.dataset.p}else{const n=+b.dataset.n;if(S[c]===n)delete S[c];else S[c]=n}save();const y=scrollY;drawA();scrollTo(0,y)};
function stats(d){const l=ITEMS.filter(i=>i.d===d),a=l.filter(i=>S[i.code]!=null);const got=a.reduce((s,i)=>s+S[i.code],0),mx=a.reduce((s,i)=>s+Math.max(i.max||0,...Object.keys(i.lv).map(Number)),0);return{n:l.length,a:a.length,got,mx,p:mx?Math.round(got/mx*100):null}}
const cls=p=>p>=75?["g","قوة"]:p>=50?["y","متوسط"]:["r","ضعف"];
function drawR(){const st=doms.map(d=>[d,stats(d)]);const ev=st.filter(([,s])=>s.a);
let h=`<div class="card"><h2>ملخص الحالة</h2><p>الاسم: <b>${C.name||"—"}</b> — العمر: ${age()||"—"} — تاريخ التقييم: ${C.ad||"—"}</p>${C.comp?`<p class="mu">الشكوى: ${C.comp}</p>`:""}${C.str?`<p class="mu">نقاط القوة المذكورة: ${C.str}</p>`:""}</div>`;
if(!ev.length){h+=`<div class="card">ابدأ بتقييم بعض المجالات علشان تظهر النتائج.</div>`}else{
h+=`<div class="card"><h2>الدرجات حسب المجال</h2><table><tr><th>المجال</th><th>الدرجة</th><th>النسبة</th><th></th></tr>${ev.map(([d,s])=>{const[c,t]=cls(s.p);return`<tr><td>${d} ${DOM[d]}<div class="mu">${s.a}/${s.n} بند</div></td><td>${s.got}/${s.mx}</td><td>${s.p}%<div class="bar"><i class="${c}" style="width:${s.p}%"></i></div></td><td><span class="tg ${c}">${t}</span></td></tr>`}).join("")}</table></div>`;
const sw=(f)=>ev.filter(([,s])=>f(s.p)).map(([d,s])=>`${DOM[d]} (${s.p}%)`).join("، ")||"—";
h+=`<div class="card"><h2>نقاط القوة والضعف</h2><p>✅ <b>نقاط القوة (75% فأكثر):</b> ${sw(p=>p>=75)}</p><p>🟡 <b>متوسط:</b> ${sw(p=>p>=50&&p<75)}</p><p>🔻 <b>نقاط الضعف (أقل من 50%):</b> ${sw(p=>p<50)}</p></div>`;
h+=`<div class="card"><h2>أهداف تحتاج تدريب والأنشطة المقترحة</h2><p class="mu">بتظهر هنا تلقائيا أي بنود درجتها أقل من الدرجة الكاملة أو الطفل بيؤديها بمساعدة (لفظية/إشارية/جسدية).</p><div class="noprint"><label>عرض</label><select id="flt" onchange="drawR()"><option value="all"${window.F!=="weak"?" selected":""}>كل البنود غير المتقنة</option><option value="weak"${window.F==="weak"?" selected":""}>مجالات الضعف فقط</option></select></div>`;
doms.forEach(d=>{const s=stats(d);if(window.F==="weak"&&s.p!=null&&s.p>=50)return;const g=ITEMS.filter(i=>i.d===d&&need(i));if(!g.length)return;
h+=`<h3>${d} — ${DOM[d]}</h3>`+g.map(i=>{const n=Math.min((S[i.code]??0)+1,mxOf(i)),hp=P[i.code]&&P[i.code]!=="i";return`<div class="gl"><b><span class="cd">${i.code}</span>${i.name}</b> <span class="tg r">${hp?"يحتاج تدريب: "+PL[P[i.code]]:"يحتاج تدريب"}</span><div class="mu">الدرجة الحالية: ${S[i.code]??"—"} ← الهدف القادم (${n}): ${lvTxt(i,n)}</div>${hp?`<div class="mu">هدف التدريب: الوصول للأداء المستقل بسحب المساعدة تدريجيا.</div>`:""}<div class="mu">الهدف العام: ${i.goal}</div><ul>${i.ex?`<li>تدريب بمواقف مثل: ${i.ex}</li>`:""}${ACT[d].map(a=>`<li>${a}</li>`).join("")}</ul></div>`}).join("")});
h+=`</div><div class="card"><h2>أهداف مستقلة (لا تحتاج تدريب)</h2><p class="mu">${ITEMS.filter(isInd).map(i=>i.code).join("، ")||"—"}</p></div><div class="card noprint"><button class="btn p" onclick="print()">طباعة / حفظ PDF</button></div>`}
$("#rs").innerHTML=h;const f=$("#flt");if(f)f.onchange=()=>{window.F=f.value;drawR()}}
function resetAll(){if(confirm("مسح كل البيانات؟")){S={};C={};P={};save();location.reload()}}

</script></body></html>
